[package]
name = "luaml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pattern-matched script engine: YAML execution policies + Lua behaviors"

[features]
default = []
file-watch = ["dep:notify", "dep:notify-debouncer-mini"]
# Opt-in helpers (EngineBuilder, `event!` macro) for consumer tests. Always on
# inside luaml's own `cfg(test)`.
testing = []

[dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored"] }
notify = { version = "7", optional = true }
notify-debouncer-mini = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
