[package]
name = "luaml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pattern-matched script engine: YAML execution policies + Lua behaviors"

[features]
default = []
file-watch = ["dep:notify", "dep:notify-debouncer-mini"]
# Opt-in helpers (EngineBuilder, `event!` macro) for consumer tests. Always on
# inside luaml's own `cfg(test)`.
testing = []

[dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored"] }
notify = { version = "7", optional = true }
notify-debouncer-mini = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "process", "fs"] }
toml = "0.8"

# stdlib deps (L9-L26)
base64 = "0.22"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
sha3 = "0.10"
url = "2"
